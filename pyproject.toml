[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "history-of-countries"
version = "0.1.0"
description = "Simple Gemini-narrated history videos using licensed images and footage"
requires-python = ">=3.11,<3.13"
dependencies = ["requests>=2.32,<3", "Pillow>=11,<12", "numpy>=1.26,<2", "scipy>=1.11,<2", "soundfile>=0.12,<1", "google-genai>=1.50,<2", "cairocffi>=1.7,<2", "yt-dlp[default]>=2026.1.1", "bgutil-ytdlp-pot-provider>=2.0", "PySocks>=1.7,<2"]
[project.optional-dependencies]
alignment = ["faster-whisper>=1.2,<2", "av>=16,<17"]
test = ["pytest>=8,<9", "PyYAML>=6,<7"]
[project.scripts]
history-countries = "history_of_countries.runner:main"
[tool.setuptools.packages.find]
include = ["history_of_countries*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
