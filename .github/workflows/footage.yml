name: Rehearse story and deep footage research
on:
  push:
    branches: [main]
    paths: ['production/footage-tests/*.json']
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        default: The Entire History of Ethiopia
        required: true
        type: string
      brief:
        description: Small story brief
        default: Explain Ethiopia through consequential choices, from Aksum to the November 2022 Pretoria agreement.
        required: true
        type: string
      minutes:
        description: Target length
        default: 8.75
        type: number
      resume_run:
        description: Optional prior footage-research run to reuse cached work
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: countries-footage-rehearsal
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: '1'
      GEMINI_SCHEMA_MODE: prompt
      GEMINI_EDITOR_MODEL: gemini-3.5-flash-lite
      GEMINI_FOOTAGE_MODEL: gemini-3.5-flash-lite
      GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_INPUT_TOKEN_BUDGET: '40000'
      GEMINI_TEXT_REQUEST_BUDGET: '48'
      GEMINI_MEDIA_LEDGER: work/footage/gemini/usage.json
      YOUTUBE_FORCE_RESEARCH: 'true'
      YOUTUBE_SEARCH_QUERIES: '200'
      YOUTUBE_RESULTS_PER_QUERY: '8'
      YOUTUBE_METADATA_LIMIT: '200'
      YOUTUBE_REVIEW_LIMIT: '16'
      YOUTUBE_MAX_CLIPS: '32'
      YOUTUBE_SEARCH_SECONDS: '1200'
      YOUTUBE_TOTAL_SECONDS: '4800'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python scripts/bootstrap_media.py
      - run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure optional YouTube session
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python scripts/prepare_cookies.py
      - name: Start YouTube proof-of-origin service
        continue-on-error: true
        run: docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
      - name: Prepare Cloudflare WARP download route
        continue-on-error: true
        timeout-minutes: 5
        run: bash scripts/warp_proxy.sh
      - name: Select rehearsal input and checkpoint
        run: python scripts/footage_trial.py --configure
      - name: Restore prior footage research
        if: env.FOOTAGE_RESUME_RUN != ''
        uses: actions/download-artifact@v4
        with:
          name: footage-research
          run-id: ${{ env.FOOTAGE_RESUME_RUN }}
          github-token: ${{ github.token }}
          path: work/footage-restore
      - name: Write, compare and research the actual story
        env:
          GEMINI_API_KEY: ${{ secrets.gemini_api_key }}
        run: python scripts/footage_trial.py
      - name: Preserve inspected clips, writing and discovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footage-research
          path: work/footage
          retention-days: 30
          if-no-files-found: warn
      - name: Remove temporary download credentials and proxy
        if: always()
        run: python scripts/cleanup_download_access.py
